name: One-time Laravel Pint formatting

on:
  push:
    branches: ["feat/v02-canonical-descriptors"]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'lavertia/forms' && github.ref == 'refs/heads/feat/v02-canonical-descriptors'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v02-canonical-descriptors
          path: forms
      - uses: actions/checkout@v4
        with:
          repository: lavertia/support
          ref: main
          path: support
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none
      - name: Run the repository's Laravel Pint formatter
        working-directory: forms
        run: |
          composer config repositories.lavertia-support '{"type":"path","url":"../support","options":{"symlink":true,"versions":{"lavertia/support":"0.1.0"}}}'
          composer install --no-interaction --prefer-dist --no-progress
          ./vendor/bin/pint src tests
      - name: Commit only formatted PHP sources on feature branch
        run: |
          git -C forms config user.name 'github-actions[bot]'
          git -C forms config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C forms add src tests
          if ! git -C forms diff --cached --quiet; then
            git -C forms commit -m 'style: apply Laravel Pint to package PHP files'
            git -C forms push origin HEAD:feat/v02-canonical-descriptors
          fi
